backend:
  name: github
  repo: Npdevil007/portfolio
  branch: main
  base_url: https://decap-cms-github-oauth-api.ss692223sushil.workers.dev

media_folder: "images"
public_folder: "images"

collections:
  - name: "posts"
    label: "Posts"
    folder: "posts"
    create: true
    # No {{slug}} here: slug comes from the title, which is now optional.
    # The timestamp makes every filename unique even for picture-only posts.
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{title}} {{date}}"
    fields:
      - { label: "Title", name: "title", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }
